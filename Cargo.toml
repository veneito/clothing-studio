[package]
name = "clothing-studio"
version = "1.0.3"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.7.0"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.34.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = { version = "3", features = ["windows-native"] }
ndarray = "0.17"
ort = "2.0.0-rc.15"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg-wgpu", "unstable-wgpu-30", "accessibility", "compat-1-2"] }
ureq = "3.5.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

# Debug builds were too slow to orbit smoothly: optimize dependencies (image, wgpu, slint) always.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
